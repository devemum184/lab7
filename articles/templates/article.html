<!DOCTYPE html>
<html>
<head>
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}/static/css/article.css">
</head>
<body class="article">
    <div class="header">
        <div class="header-left">
            <span class="blog-name">Django public blog</span>
        </div>
        <div class="header-right">
            {% if user.is_authenticated %}
                <span class="all-posts-link">Вы вошли как {{ user.username }}</span>
                <a href="{% url 'logout' %}" class="all-posts-link">Выйти</a>
            {% else %}
                <a href="{% url 'register' %}" class="all-posts-link">Регистрация</a>
                <a href="{% url 'login' %}" class="all-posts-link">Войти</a>
            {% endif %}
            <a href="/" class="all-posts-link">Все статьи</a>
        </div>
    </div>
    <div class="content">
        <h1 class="post-title-main">{{ post.title }}</h1>
        <div class="article-info">
            <div class="article-author">{{ post.author.username }}</div>
            <div class="article-created-date">{{ post.created_date }}</div>
        </div>
        <div class="article-text-full">{{ post.text }}</div>
    </div>
</body>
</html>
